name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Configure optional signing
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CERT_PFX_SECRET: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD_SECRET: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_SECRET" ]; then
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$WINDOWS_CERT_PFX_SECRET" ]; then
            echo "WINDOWS_CERTIFICATE=$WINDOWS_CERT_PFX_SECRET" >> "$GITHUB_ENV"
            echo "WINDOWS_CERTIFICATE_PASSWORD=$WINDOWS_CERT_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Presence Bridge v__VERSION__
          releaseBody: Cross-platform desktop release. Builds are unsigned unless signing secrets are configured.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --dir release-assets
      - name: Verify release targets this source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > release.json
          node scripts/verify-release-provenance.mjs release.json "${GITHUB_SHA}" "${GITHUB_REF_NAME}"
      - name: Build checksums and manifest
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          python3 - <<'PY'
          import json, os
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['GITHUB_REF_NAME']
          files = [f for f in os.listdir('.') if f not in ('SHA256SUMS', 'latest.json')]
          url = lambda f: f"https://github.com/{repo}/releases/download/{tag}/{f}"
          data = {
            "version": tag.lstrip('v'),
            "source_commit": os.environ['GITHUB_SHA'],
            "platforms": {
              "macos": [url(f) for f in files if f.endswith(('.dmg', '.app.tar.gz'))],
              "windows": [url(f) for f in files if f.endswith(('.msi', '.exe'))],
              "linux": [url(f) for f in files if f.endswith(('.AppImage', '.deb', '.rpm'))]
            }
          }
          open('latest.json', 'w').write(json.dumps(data, indent=2) + '\n')
          PY
      - name: Upload checksums and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/SHA256SUMS release-assets/latest.json --clobber

  windows-installer-smoke:
    needs: manifest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and open the published Windows app
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./public/install.ps1

  linux-installer-smoke:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xdg-utils libegl1 libgles2 libgl1-mesa-dri gstreamer1.0-plugins-base dbus-x11
      - name: Install and exercise the checksum-verified Linux AppImage opener
        shell: bash
        run: |
          export XDG_BIN_HOME="$RUNNER_TEMP/presence-bridge-bin"
          sh ./public/install.sh
          test -x "$XDG_BIN_HOME/presence-bridge"
          "$XDG_BIN_HOME/presence-bridge" --appimage-version
          export APPIMAGE_EXTRACT_AND_RUN=1
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          native_output=$(xvfb-run -a "$XDG_BIN_HOME/presence-bridge" --smoke-opener 2>&1)
          printf '%s\n' "$native_output"
          while IFS= read -r url; do
            grep -Fqx "native opener accepted $url" <<< "$native_output"
          done <<'URLS'
          slack://user?team=T123&id=U123
          msteams://teams.microsoft.com/l/chat/0/0?users=ava@example.com
          https://meet.google.com/abc-defg-hij
          mailto:ava@example.com
          zoommtg://zoom.us/join?confno=123456789
          tel:+15550199
          URLS
