[package]
name = "presence-bridge"
version = "0.1.8"
description = "A local team presence roster and contact handoff"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "presence_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
